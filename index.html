<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPlus</title>
    <meta name="author" content="Xavier">
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <!-- Encabezado / Navbar -->
    <header class="navbar">
        <div class="nav-brand">
            <span class="logo-icon">💻</span>
            <h1 class="logo-text">
                <h3 class="logo-taco">Tech</h3><span class="logo-palace">Plus</span>
            </h1>
        </div>


        <nav class="header-nav">
            <a href="#" class="active">Inicio</a>
            <a href="#">Servicios</a>
            <a href="#">Proyectos</a>
            <a href="#">Contacto</a>
        </nav>

        <div class="search-bar">
            <input type="search" placeholder="Buscar Servicios">
            <button type="button" aria-label="Buscar">Buscar</button>
        </div>
    </header>
    <main class="contenedorPrincipal">
        <section class="parteArriba">
            <div class="main-content">
                <div class="banner">
                    <div class="banner-text">
                        <h4>Soporte y Soluciones</h4>
                        <h2>Tecnología que impulsa tu negocio</h2>
                        <p><span class="domicilio">Soporte, desarrollo y asesoría informática
                                para empresas y personas.</span></p>
                        <button class="button-banner">Ver servicios -></button>
                    </div>
                    <div class="banner-img-container" id="bannerImgContainer">
                        <img src="" alt="" class="banner-img" id="bannerImg">
                    </div>
                </div>
        </section>
        <section class="parteMedio">
            <div class="lugarPrincipal">
                <div class="texto">
                    <h2>Nuestros Servicios</h2>
                </div>
                <div class="categories">
                    <div class="category-item">
                        <img src=""
                            alt="Enchiladas" class="category-img">
                        <div class="category-name">Soporte tecnico</div>
                    </div>
                    <div class="category-item">
                        <img src=""
                            alt="Tacos" class="category-img">
                        <div class="category-name">Redes y conectividad</div>
                    </div>
                    <div class="category-item">
                        <img src=""
                            alt="Flautas" class="category-img">
                        <div class="category-name">Desarrollo web</div>
                    </div>
                    <div class="category-item">
                        <img src=""
                            alt="Gorditas" class="category-img">
                        <h1 class="category-name">Seguridad informatica</h1>
                    </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

</html>
